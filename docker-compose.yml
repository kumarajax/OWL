services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-owldrive}
      POSTGRES_USER: ${POSTGRES_USER:-owldrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak-db-init:
    image: postgres:16
    depends_on:
      - postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      [
        "sh",
        "-lc",
        "until pg_isready -h postgres -U ${POSTGRES_USER:-owldrive} -d ${POSTGRES_DB:-owldrive} >/dev/null 2>&1; do sleep 1; done; psql -h postgres -U ${POSTGRES_USER:-owldrive} -d ${POSTGRES_DB:-owldrive} -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION ${POSTGRES_USER:-owldrive};'"
      ]
    restart: "no"

  keycloak:
    build:
      context: ./infra/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-owldrive}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-owldrive}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_FEATURES: persistent-user-sessions
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://auth.owl-drive.com
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/owldrive?currentSchema=app
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-owldrive}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      APP_STORAGE_MINIO_ENDPOINT: http://minio:9000
      APP_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      APP_STORAGE_MINIO_BUCKET: owl-drive
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://owl-drive.com}
      APP_LEGAL_CURRENT_VERSION: ${APP_LEGAL_CURRENT_VERSION:-2026-05-26}
      APP_LEGAL_CONTACT_EMAIL: ${APP_LEGAL_CONTACT_EMAIL:-kumarajax@gmail.com}
      USER_CREATION_APPROVAL_REQUIRED: ${USER_CREATION_APPROVAL_REQUIRED:-Y}
      APP_SIGNUP_APPROVAL_EMAIL_TO: ${APP_SIGNUP_APPROVAL_EMAIL_TO:-kumarajax@gmail.com}
      APP_SIGNUP_PASSWORD_ENCRYPTION_KEY: ${APP_SIGNUP_PASSWORD_ENCRYPTION_KEY:-local-dev-change-me}
      APP_SIGNUP_APPROVAL_TOKEN_DAYS: ${APP_SIGNUP_APPROVAL_TOKEN_DAYS:-7}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-false}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://owl-drive.com,https://www.owl-drive.com
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: https://*.owl-drive.com,http://192.168.*.*:3000,http://10.*.*.*:3000,http://172.*.*.*:3000
      APP_SECURITY_OAUTH2_JWT_ALLOWED_ISSUERS: https://auth.owl-drive.com/realms/owldrive,http://localhost:8080/realms/owldrive,http://127.0.0.1:8080/realms/owldrive
      APP_SECURITY_OAUTH2_JWT_ALLOWED_ISSUER_PATTERNS: http://192.168.*.*:8080/realms/owldrive,http://10.*.*.*:8080/realms/owldrive,http://172.*.*.*:8080/realms/owldrive
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - keycloak
      - minio

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.owl-drive.com
        NEXT_PUBLIC_KEYCLOAK_URL: https://auth.owl-drive.com
        NEXT_PUBLIC_UPLOAD_CHUNK_SIZE_BYTES: ${NEXT_PUBLIC_UPLOAD_CHUNK_SIZE_BYTES:-52428800}
        NEXT_PUBLIC_LEGAL_CURRENT_VERSION: ${APP_LEGAL_CURRENT_VERSION:-2026-05-26}
        NEXT_PUBLIC_USER_CREATION_APPROVAL_REQUIRED: ${USER_CREATION_APPROVAL_REQUIRED:-Y}
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.owl-drive.com
      NEXT_PUBLIC_KEYCLOAK_URL: https://auth.owl-drive.com
      NEXT_PUBLIC_UPLOAD_CHUNK_SIZE_BYTES: ${NEXT_PUBLIC_UPLOAD_CHUNK_SIZE_BYTES:-52428800}
      NEXT_PUBLIC_LEGAL_CURRENT_VERSION: ${APP_LEGAL_CURRENT_VERSION:-2026-05-26}
      NEXT_PUBLIC_USER_CREATION_APPROVAL_REQUIRED: ${USER_CREATION_APPROVAL_REQUIRED:-Y}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak

volumes:
  postgres-data:
  minio-data:
