services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: owldrive
      POSTGRES_USER: owldrive
      POSTGRES_PASSWORD: owldrive_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  keycloak:
    build:
      context: ./infra/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/owldrive?currentSchema=app
      SPRING_DATASOURCE_USERNAME: owldrive
      SPRING_DATASOURCE_PASSWORD: owldrive_dev_password
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      APP_STORAGE_MINIO_ENDPOINT: http://minio:9000
      APP_STORAGE_MINIO_ACCESS_KEY: minioadmin
      APP_STORAGE_MINIO_SECRET_KEY: minioadmin
      APP_STORAGE_MINIO_BUCKET: owl-drive
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - minio
      - keycloak

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak

volumes:
  postgres-data:
  minio-data:
