services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: owldrive
      POSTGRES_USER: owldrive
      POSTGRES_PASSWORD: owldrive_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  keycloak-db-init:
    image: postgres:16
    depends_on:
      - postgres
    environment:
      PGPASSWORD: owldrive_dev_password
    command:
      [
        "sh",
        "-lc",
        "until pg_isready -h postgres -U owldrive -d owldrive >/dev/null 2>&1; do sleep 1; done; psql -h postgres -U owldrive -d owldrive -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION owldrive;'"
      ]
    restart: "no"

  keycloak:
    build:
      context: ./infra/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/owldrive?currentSchema=keycloak
      KC_DB_USERNAME: owldrive
      KC_DB_PASSWORD: owldrive_dev_password
      KC_FEATURES: persistent-user-sessions
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/owldrive?currentSchema=app
      SPRING_DATASOURCE_USERNAME: owldrive
      SPRING_DATASOURCE_PASSWORD: owldrive_dev_password
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      APP_STORAGE_LOCAL_CONFIG_FILE: /app/config/storage-roots.conf
      APP_STORAGE_LOCAL_FALLBACK_ROOT: /app/data/storage
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8081:8081"
    volumes:
      - ./infra/storage-roots.conf:/app/config/storage-roots.conf:ro
      - ./backend/data/storage:/app/data/storage
    depends_on:
      - postgres
      - keycloak

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak

volumes:
  postgres-data:
