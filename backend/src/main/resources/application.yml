server:
  port: 8081

spring:
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
  servlet:
    multipart:
      max-file-size: ${APP_STORAGE_MAX_FILE_SIZE:1GB}
      max-request-size: ${APP_STORAGE_MAX_REQUEST_SIZE:1GB}
  datasource:
    url: jdbc:postgresql://localhost:5432/owldrive?currentSchema=app
    username: ${POSTGRES_USER:owldrive}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: false
    schemas: app
    create-schemas: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  legal:
    current-version: ${APP_LEGAL_CURRENT_VERSION:2026-05-26}
    contact-email: ${APP_LEGAL_CONTACT_EMAIL:kumarajax@gmail.com}
  signup:
    approval-required: ${USER_CREATION_APPROVAL_REQUIRED:Y}
    approval-email-to: ${APP_SIGNUP_APPROVAL_EMAIL_TO:kumarajax@gmail.com}
    password-encryption-key: ${APP_SIGNUP_PASSWORD_ENCRYPTION_KEY:local-dev-change-me}
    token-days: ${APP_SIGNUP_APPROVAL_TOKEN_DAYS:7}
  users:
    max-users: ${APP_USERS_MAX_USERS:1000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*.*:3000,http://10.*.*.*:3000,http://172.*.*.*:3000}
  security:
    oauth2:
      jwt:
        jwk-set-uri: ${APP_SECURITY_OAUTH2_JWT_JWK_SET_URI:${KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/owldrive/protocol/openid-connect/certs}
        allowed-issuers: ${APP_SECURITY_OAUTH2_JWT_ALLOWED_ISSUERS:}
        allowed-issuer-patterns: ${APP_SECURITY_OAUTH2_JWT_ALLOWED_ISSUER_PATTERNS:http://localhost:8080/realms/owldrive,http://127.0.0.1:8080/realms/owldrive,http://192.168.*.*:8080/realms/owldrive,http://10.*.*.*:8080/realms/owldrive,http://172.*.*.*:8080/realms/owldrive}
  storage:
    max-upload-bytes: ${APP_STORAGE_MAX_UPLOAD_BYTES:9223372036854775807}
    reject-empty-files: true
